<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Book Maker</title>

  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/file-saver@2.0.5/dist/FileSaver.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

  <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="top-bar">
  <strong>📖 Book Maker</strong>
  <button onclick="insertSceneBreak()">*** Scene Break</button>
  <button onclick="openSearch()">🔍 Search</button>
  <button onclick="aiRewrite()">✨ AI Rewrite</button>
  <button onclick="aiExpand()">📝 AI Expand</button>
  <button onclick="aiContinue()">➡️ AI Continue</button>
  <button onclick="undo()">↶ Undo</button>
  <button onclick="openSettings()">⚙ Settings</button>
  <button onclick="exportJSON()">💾 JSON</button>
  <button onclick="exportEPUB()">📕 EPUB</button>
  <button onclick="exportPDF()">📄 PDF</button>
  <span id="saveStatus">Saved ✓</span>
  <span><strong id="totalWords">0</strong> words</span>
</div>

<div style="display:flex;height:calc(100vh - 50px);">
  <div style="width:260px;padding:10px;overflow:auto;background:#fff;border-right:1px solid #ddd;">
    <button onclick="addChapter()" style="width:100%;padding:10px;background:#06b6d4;color:white;border:none;border-radius:4px;margin-bottom:10px;">＋ Add Chapter</button>
    <div id="chapterList"></div>
  </div>

  <div style="flex:1;padding:30px;overflow:auto;">
    <input id="chapterTitle" placeholder="Chapter Title" style="font-size:32px;width:100%;border:none;margin-bottom:20px;font-weight:bold;">
    <div id="editor" class="editor" contenteditable="true"></div>
  </div>
</div>

<!-- Search Modal -->
<div class="modal" id="searchModal">
  <div class="modal-content">
    <h3>Search & Replace</h3>
    <input id="searchFind" placeholder="Find">
    <input id="searchReplace" placeholder="Replace">
    <button onclick="runReplace(false)">Replace in Chapter</button>
    <button onclick="runReplace(true)">Replace All</button>
    <button onclick="closeSearch()">Cancel</button>
  </div>
</div>

<!-- Settings Modal -->
<div class="modal" id="settingsModal">
  <div class="modal-content">
    <h3>AI Settings</h3>
    <label>Cloudflare Worker Endpoint:</label>
    <input id="aiEndpoint" placeholder="https://your-worker.workers.dev">
    <label>API Token:</label>
    <input id="aiToken" type="password" placeholder="Your secret token">
    <p style="font-size:12px;color:#666;">Configure your Cloudflare Worker URL and authentication token for AI features.</p>
    <button onclick="saveSettings()">Save Settings</button>
    <button onclick="closeSettings()">Cancel</button>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
