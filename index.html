<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Book Maker</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />

<!-- Libraries -->
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/file-saver@2.0.5/dist/FileSaver.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>

<style>
body { margin:0; font-family: system-ui, Arial; background:#f5f6f8; }
header { background:#111; color:#fff; padding:10px 16px; display:flex; align-items:center; gap:12px; }
header strong { font-size:18px; }
header button { padding:6px 10px; }

#layout { display:flex; height:calc(100vh - 48px); }

#sidebar {
  width:240px;
  background:#1e1f22;
  color:#fff;
  padding:10px;
  overflow:auto;
}
#sidebar h3 { margin:6px 0; font-size:14px; }

.chapter {
  background:#2a2c31;
  margin-bottom:6px;
  padding:6px;
  border-radius:6px;
  cursor:pointer;
}
.chapter.active { background:#4b68ff; }
.chapter button { float:right; }

#main {
  flex:1;
  display:flex;
  flex-direction:column;
}

#toolbar {
  background:#fff;
  border-bottom:1px solid #ccc;
  padding:8px;
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  align-items:center;
}

#editor {
  flex:1;
  padding:24px;
  background:#fff;
  outline:none;
  overflow:auto;
}

#editor:focus { outline:none; }

#chapterTitle {
  width:100%;
  padding:10px;
  font-size:20px;
  border:none;
  border-bottom:1px solid #ccc;
}

select, input[type=text] { padding:6px; }
button { cursor:pointer; }

#saveStatus { margin-left:auto; font-size:12px; color:#555; }

.modal {
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.5);
  display:none;
  align-items:center;
  justify-content:center;
}
.modal.active { display:flex; }
.modal-box {
  background:#fff;
  padding:20px;
  width:360px;
  border-radius:8px;
}
</style>
</head>
<body>

<header>
  <strong>📘 Book Maker</strong>

  <button onclick="addChapter()">➕ Chapter</button>
  <button onclick="undo()">↩ Undo</button>

  <button onclick="aiRewrite()">✍ Rewrite</button>
  <button onclick="aiExpand()">➕ Expand</button>
  <button onclick="aiSummarize()">🧠 Summarize</button>
  <button onclick="aiContinue()">➡ Continue</button>

  <button onclick="openSettings()">⚙ Settings</button>

  <span id="saveStatus">Saved ✓</span>
</header>

<div id="layout">
  <div id="sidebar">
    <h3>Chapters</h3>
    <div id="chapterList"></div>
  </div>

  <div id="main">
    <input id="chapterTitle" placeholder="Chapter title..." />

    <div id="toolbar">
      Mode:
      <select id="aiMode">
        <option value="rewrite">Rewrite</option>
        <option value="expand">Expand</option>
        <option value="summarize">Summarize</option>
        <option value="continue">Continue</option>
      </select>

      Template:
      <select id="aiTemplate">
        <option value="default">Default</option>
        <option value="dramatic">Dramatic</option>
        <option value="concise">Concise</option>
        <option value="descriptive">Descriptive</option>
      </select>

      Model:
      <select id="aiModel">
        <option value="gpt-4o-mini">gpt-4o-mini</option>
        <option value="gpt-4.1-mini">gpt-4.1-mini</option>
        <option value="gpt-4.1">gpt-4.1</option>
      </select>

      <label>
        <input type="checkbox" id="aiStream" checked />
        Streaming
      </label>

      <span style="margin-left:auto">Total words: <span id="totalWords">0</span></span>
    </div>

    <div id="editor" contenteditable="true"></div>
  </div>
</div>

<!-- SETTINGS MODAL -->
<div class="modal" id="settingsModal">
  <div class="modal-box">
    <h3>AI Settings</h3>

    <div>
      <label>Worker Endpoint</label><br>
      <input id="aiEndpoint" style="width:100%" placeholder="https://bookmaker-ai....workers.dev">
    </div>

    <div style="margin-top:10px">
      <label>Access Token</label><br>
      <input id="aiToken" style="width:100%" placeholder="your BOOKMAKER_TOKEN">
    </div>

    <div style="margin-top:16px; text-align:right">
      <button onclick="closeSettings()">Cancel</button>
      <button onclick="saveSettings()">Save</button>
    </div>
  </div>
</div>

<script src="app.js"></script>

<script>
function openSettings() {
  document.getElementById("settingsModal").classList.add("active");
}
function closeSettings() {
  document.getElementById("settingsModal").classList.remove("active");
}
</script>

</body>
</html>
