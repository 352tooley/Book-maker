<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Book Maker</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />

<!-- Libraries -->
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/diff-match-patch@1.0.5/index.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mammoth@1.4.25/mammoth.browser.min.js"></script>

<style>
body { margin:0; font-family: system-ui, Arial; background:#f5f6f8; }
header { background:#111; color:#fff; padding:10px 16px; display:flex; align-items:center; gap:10px; }
header strong { font-size:18px; }
header button { padding:6px 10px; border-radius:8px; border:0; background:#2a2c31; color:#fff; cursor:pointer; }
header .primary { background:#4b68ff; }
#saveStatus { margin-left:auto; font-size:12px; opacity:.8; }

#layout { display:flex; height:calc(100vh - 48px); }

#sidebar {
  width:240px;
  background:#1e1f22;
  color:#fff;
  padding:10px;
  overflow:auto;
}
#sidebar h3 { margin:6px 0 10px; font-size:14px; }

.chapter {
  background:#2a2c31;
  margin-bottom:6px;
  padding:8px;
  border-radius:8px;
  cursor:pointer;
}
.chapter.active { background:#4b68ff; }

#main {
  flex:1;
  display:flex;
  flex-direction:column;
}

#chapterTitle {
  width:100%;
  padding:10px;
  font-size:20px;
  border:none;
  border-bottom:1px solid #ccc;
}

#toolbar {
  background:#fff;
  border-bottom:1px solid #ccc;
  padding:8px;
  display:flex;
  gap:8px;
  align-items:center;
  flex-wrap:wrap;
}

#editor {
  flex:1;
  padding:24px;
  background:#fff;
  outline:none;
  overflow:auto;
}

ins { background:#d1fae5; }
del { background:#fee2e2; text-decoration:line-through; }

.modal {
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.5);
  display:none;
  align-items:center;
  justify-content:center;
}
.modal.active { display:flex; }
.modal-box {
  background:#fff;
  padding:20px;
  width:360px;
  border-radius:8px;
}
</style>
</head>
<body>

<header>
  <strong>📘 Book Maker</strong>

  <button onclick="addChapter()">➕ Chapter</button>

  <input type="file" id="docxInput" accept=".docx" hidden>
  <button onclick="document.getElementById('docxInput').click()">📄 Import DOCX</button>

  <button onclick="undo()">↩ Undo</button>

  <button class="primary" onclick="aiRewrite()">Rewrite</button>
  <button class="primary" onclick="aiExpand()">Expand</button>
  <button class="primary" onclick="aiSummarize()">Summarize</button>
  <button class="primary" onclick="aiContinue()">Continue</button>

  <button onclick="openSettings()">⚙ Settings</button>

  <button onclick="aiApply()">✅ Apply</button>
  <button onclick="aiReject()">❌ Reject</button>

  <span id="saveStatus">Saved ✓</span>
</header>

<div id="layout">
  <div id="sidebar">
    <h3>Chapters</h3>
    <div id="chapterList"></div>
  </div>

  <div id="main">
    <input id="chapterTitle" placeholder="Chapter title..." />
    <div id="toolbar">
      <span>Total words: <span id="totalWords">0</span></span>
    </div>
    <div id="editor" contenteditable="true"></div>
  </div>
</div>

<!-- SETTINGS MODAL -->
<div class="modal" id="settingsModal">
  <div class="modal-box">
    <h3>AI Settings</h3>
    <div>
      <label>Worker Endpoint</label><br>
      <input id="aiEndpoint" style="width:100%" placeholder="https://....workers.dev">
    </div>
    <div style="margin-top:10px">
      <label>Access Token</label><br>
      <input id="aiToken" style="width:100%" placeholder="BOOKMAKER_TOKEN">
    </div>
    <div style="margin-top:16px; text-align:right">
      <button onclick="closeSettings()">Cancel</button>
      <button onclick="saveSettings()">Save</button>
    </div>
  </div>
</div>

<script src="app.js"></script>

<script>
function openSettings(){ document.getElementById("settingsModal").classList.add("active"); }
function closeSettings(){ document.getElementById("settingsModal").classList.remove("active"); }
</script>

</body>
</html>
